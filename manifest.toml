#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "faceprivacy"
name = "FacePrivacy"
description.en = "Face Blurring Application"
description.fr = "Application de Floutage de Visages"

version = "2026.05.17~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://faceprivacy.forge.apps.education.fr/app/"
demo = "https://faceprivacy.forge.apps.education.fr/app/"
code = "https://forge.apps.education.fr/faceprivacy/app"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "70M"
ram.runtime = "30M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/faceprivacy"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://forge.apps.education.fr/faceprivacy/app/-/archive/1fa273c9a950a3c5dde0a510bd46bbe9310b9279/app-1fa273c9a950a3c5dde0a510bd46bbe9310b9279.tar.bz2"
    sha256 = "c893ac33ccc506543ba332a145e6aebc5cd8ff6e0c87f83c818f0292b6a4a232"

    autoupdate.strategy = "latest_gitlab_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
