#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "faceprivacy"
name = "FacePrivacy"
description.en = "Face Blurring Application"
description.fr = "Application de Floutage de Visages"

version = "2026.10.17~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://faceprivacy.forge.apps.education.fr/app/"
demo = "https://faceprivacy.forge.apps.education.fr/app/"
code = "https://forge.apps.education.fr/faceprivacy/app"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "70M"
ram.runtime = "30M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/faceprivacy"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://forge.apps.education.fr/faceprivacy/app/-/archive/1eb748aff7129733786fe8fc386ce48e057ff15e/app-1eb748aff7129733786fe8fc386ce48e057ff15e.tar.bz2"
    sha256 = "1c7cb8c05ad0c0ebcbc7f44be40de41c6b823a1150fea97896d2225bdbe3b026"

    autoupdate.strategy = "latest_gitlab_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
